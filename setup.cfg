[metadata]
name = sasci360solexecute
version = 0.0.1
author = Nelson Grey LLC
author_email = support@nelsongrey.com
description = Python client for SAS Customer Intelligence 360 Marketing Execution APIs
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mnelson3/sas-ci360-sol-execute
project_urls = Bug Tracker = https://github.com/mnelson3/sas-ci360-sol-execute/issues
classifiers = Programming Language :: Python :: 3
	License :: Other/Proprietary License
	Operating System :: OS Independent

[options]
package_dir = = src
packages = find:
python_requires = >=3.8
install_requires =
	pandas>=2.0.0
	PyJWT>=2.0.0
	requests>=2.31.0
	saspy>=5.0.0
	schedule>=1.1.0
	DateTime~=4.3
	sasci360apimarketingexecution~=0.0.1
	sasci360apicore~=0.0.1
	urllib3~=1.26.9

[options.packages.find]
where = src
